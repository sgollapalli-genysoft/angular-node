<p>login works!</p>

<div class="container">
    <h2>Login</h2>
  
    <form (ngSubmit)="onSubmit()">
      <div>
        <input type="email" 
               [(ngModel)]="email" 
               name="email" 
               placeholder="Email" 
               required>
      </div>
      <div>
        <input type="password" 
               [(ngModel)]="password" 
               name="password" 
               placeholder="Password" 
               required>
      </div>
  
      <button type="submit">Login</button>
    </form>
  
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
  </div>
